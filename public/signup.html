<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup — DuneCinema</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="container">
    <div class="form-card">
      <h2>Create Account</h2>
      <div class="field"><label>Name</label><input id="name" /></div>
      <div class="field"><label>Email</label><input id="email" type="email" /></div>
      <div class="field"><label>Password</label><input id="password" type="password" /></div>
      <div class="field"><label>Confirm Password</label><input id="confirm" type="password" /></div>
      <button class="btn primary" id="submit" style="width:100%">Sign Up</button>
      <div class="error" id="err"></div>
      <p style="margin-top:12px;color:var(--muted)">Already have an account? <a href="/login.html" style="color:var(--accent)">Login</a></p>
    </div>
  </main>
  <div class="toast"></div>
  <script src="/js/common.js"></script>
  <script src="/js/signup.js"></script>
</body>
</html>
